name: Update iCal Feeds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - generate_cobh_ics.py
      - generate_cobh_events.py
      - generate_hardened.py
      - requirements.txt
      - .github/workflows/update.yml
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (UTC)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and validate calendars
        run: python generate_hardened.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cobh-cruise.ics all-ports.ics cobh-events.ics

          if git diff --cached --quiet; then
            echo "No source calendar changes to commit."
            exit 0
          fi

          git commit -m "Update iCal feeds"
          git push
