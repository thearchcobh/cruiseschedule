name: Test calendar hardening

on:
  push:
    branches:
      - chatgpt/calendar-hardening-20260825

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile generate_cobh_ics.py generate_cobh_events.py generate_hardened.py
      - run: python generate_hardened.py
      - run: git diff --check
